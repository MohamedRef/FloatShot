name: Publish preview APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Preview release tag matching the app versionName
        required: true
        type: string
        default: v0.2.0-preview.1

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate preview tag
        shell: bash
        env:
          PREVIEW_TAG: ${{ inputs.tag || 'v0.2.0-preview.1' }}
        run: |
          set -euo pipefail
          if [[ ! "$PREVIEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo 'Invalid preview tag format' >&2
            exit 1
          fi
          EXPECTED_VERSION="${PREVIEW_TAG#v}"
          if ! grep -Fq "versionName = \"${EXPECTED_VERSION}\"" app/build.gradle.kts; then
            echo "Preview tag $PREVIEW_TAG does not match app versionName" >&2
            exit 1
          fi
          echo "PREVIEW_TAG=$PREVIEW_TAG" >> "$GITHUB_ENV"
      - name: Run Kotlin unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build preview APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FloatShot-${PREVIEW_TAG}.apk"
          (cd dist && sha256sum "FloatShot-${PREVIEW_TAG}.apk" > SHA256SUMS)
          cat > dist/RELEASE_NOTES.md <<'EOF'
          Preview version for Samsung Galaxy S24 Ultra testing.

          - Small draggable floating screenshot control.
          - Tap for a normal capture; long press for image-aligned scrolling capture.
          - Optional GitHub release update checks.
          - Explicit accessibility permission explanation before requesting access.

          This APK is an experimental, debug-signed build. It has not been validated
          on the Galaxy S24 Ultra. Google Play Protect may block direct installation
          because the app requests sensitive Accessibility capabilities.
          Do not disable device security protections to install it.

          Screenshots remain on-device; network access only checks release metadata.
          EOF
      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $PREVIEW_TAG exists; use a new preview tag instead of overwriting it" >&2
            exit 1
          fi
          gh release create "$PREVIEW_TAG" "dist/FloatShot-${PREVIEW_TAG}.apk" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FloatShot ${PREVIEW_TAG#v}" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease --latest=false
